[package]
name = "app"
version = "0.3.9"
description = "Desktop control room for OpenCoven familiars, workflows, memory, and local agent sessions."
authors = ["OpenCoven contributors"]
license = "MIT OR AGPL-3.0-only"
repository = "https://github.com/OpenCoven/coven-cave"
homepage = "https://github.com/OpenCoven/coven-cave"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }
# build.rs generates MAX_FILE_COUNT from scripts/sidecar-runtime-budget.json.
serde_json = "1.0"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# tray-icon moved to the desktop-only target block below — mobile (iOS/
# Android) doesn't have a tray and trying to enable the feature there
# breaks the build.
tauri = { version = "2.11.2", features = ["unstable", "macos-private-api"] }
tauri-plugin-log = "2"
# tauri-plugin-notification supports iOS and Android out of the box, so
# this stays cross-platform; the JS-side `native-notify` wrapper handles
# the first-run permission prompt the OS surfaces.
tauri-plugin-notification = "2"
once_cell = "1"
parking_lot = "0.12"
rand = "0.8"
tauri-plugin-os = "2"

# Desktop-only deps. `portable-pty` cannot build on iOS/Android (no
# fork, no /dev/ptmx); the bottom-terminal surface gates its frontend
# behind `__TAURI_OS__` so mobile-Tauri falls back to the same
# "Terminal is only available inside the CovenCave desktop app"
# placeholder as the Tailscale-browser path.
#
# Cargo target predicates can't use Tauri's custom `cfg(desktop)` here —
# Cargo only resolves built-in cfg predicates at manifest-parse time.
# Spelling it as "not(ios) and not(android)" is equivalent to
# `cfg(desktop)` for the platforms we care about.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
tauri = { version = "2.11.2", features = ["tray-icon", "macos-private-api"] }
portable-pty = "0.8"
# Desktop auto-update: the updater plugin checks/downloads/installs signed
# release artifacts; process gives us relaunch() after an install. Both are
# desktop-only (mobile updates via the App Store / TestFlight).
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Direct desktop IPC to the locally running Discord client. This remains out
# of mobile targets because Discord Rich Presence has no mobile client API.
discord-rich-presence = "1.1.0"
# Offline read cache (offline_cache.rs): AES-256-GCM over an HKDF-SHA256 key
# derived from a keychain-held root secret. Desktop-only because the module is
# — `keyring` has no iOS or Android backend, and there is nowhere on mobile to
# hold a root secret this cache would trust. sha2 lives here rather than in the
# Windows block it started in, because both the sidecar archive digests and the
# cache's derivation need it.
# `zeroize` is not on by default, and without it the expanded AES round-key
# schedule outlives the cipher in freed heap — which would undo the Zeroizing
# this module wraps every other piece of key material in.
aes-gcm = { version = "0.10", features = ["zeroize"] }
hkdf = "0.12"
sha2 = "0.10"
zeroize = "1"
# Advisory cross-process file locks, for the same reason sha2 moved up here:
# more than one desktop platform needs them. The Windows sidecar archive holds
# one over the runtime cache, macOS holds one over reachability ownership, and
# sidecar_port_lock.rs holds one over the dedicated port on every desktop
# target — a second copy must lose that claim wherever it launches, not only
# where a target block happened to list the crate.
fs2 = "0.4.3"

# Windows packages the large Next.js sidecar as one archive instead of one
# WiX component per file. The launcher verifies and extracts it on first use.
[target.'cfg(target_os = "windows")'.dependencies]
# One credential-store backend per OS, so no unused backend is compiled in and
# the Linux build never pulls a D-Bus stack: Credential Manager here, Keychain
# Services on macOS, the kernel session keyring on Linux. See offline_cache.rs
# for what the Linux backend's session lifetime means for the cache.
keyring = { version = "3", default-features = false, features = ["windows-native"] }
tar = "0.4"
zstd = "0.13"
# Win32_Security_Authorization is Get/SetNamedSecurityInfoW and
# ConvertSidToStringSidW: secret_path_acl.rs uses them to give the plaintext
# mobile access token a DACL, which Windows has no create-time equivalent of.
# The feature is a cfg gate over already-vendored bindings, so it pulls in no
# new crate and leaves Cargo.lock untouched.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# OS-level glass for the quick-chat tray window: NSVisualEffectView vibrancy
# behind the transparent webview on macOS (the only platform we apply it on;
# the crate compiles everywhere and the call sites are cfg(target_os) gated).
[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.6"
signal-hook-registry = "1.4"
# Signal numbers for the daemon shutdown handler; signal-hook-registry only
# exposes register(), not the SIG* constants.
libc = "0.2"
# Raw msg_send access to NSWindow's standard buttons (traffic-light
# show/hide follows the side panel); already in the tree via tauri/wry.
objc2 = "0.6"
# Native speech-to-text for local voice calls (speech.rs): WKWebView has no
# SpeechRecognition, so the packaged app captures the mic with AVAudioEngine
# and transcribes with SFSpeechRecognizer. Same objc2 0.6 generation as the
# bindings already in the tree via tauri/wry.
objc2-foundation = "0.3"
objc2-speech = "0.3"
objc2-avf-audio = "0.3"
block2 = "0.6"
keyring = { version = "3", default-features = false, features = ["apple-native"] }

# Linux desktop keeps the offline cache's root secret in the kernel session
# keyring rather than the Secret Service, so the build needs no D-Bus stack.
# The trade is that the secret does not survive a logout; the cache treats the
# resulting entries as undecryptable and refills (offline_cache.rs).
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["linux-native"] }

# Unix lifecycle tests hard-kill exact owned process groups. Keep libc
# test-only on Linux while reusing the macOS runtime dependency above.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
