name: CI
run-name: CI ${{ github.event_name }} ${{ inputs.expected_sha || github.sha }}

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Expected pull request head SHA
        required: true
        type: string
      expected_pr_number:
        description: Pull request number used for recovery concurrency
        required: true
        type: string
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A recovery dispatch resolves to the SAME group as the pull_request run it is
# rescuing — `github.event.pull_request` is null for a dispatch, so the group
# falls through to `inputs.expected_pr_number`. With cancel-in-progress on, the
# dispatch would therefore CANCEL the run it came to replace (cave-f22tp).
#
# Observed 2026-08-14 on #4618: head 11aceeb89 collected three cancelled runs
# and no verdict — a pull_request run killed ~60 minutes in, then two dispatches
# killed in turn. The cancellations are also self-perpetuating, because
# ci-recovery's `cancelled_latest_run` wedge test (cave-geaji) reads a
# cancellation as proof that recovery is needed, so each cooldown fires another
# dispatch. The required check can never report while that runs.
#
# So a dispatch never cancels: with cancel-in-progress false it QUEUES behind
# the in-flight run for that head and starts only once the group frees. A push
# still supersedes its predecessor, which is the behaviour this setting is for.
concurrency:
  group: ci-pr-${{ github.event.pull_request.number || inputs.expected_pr_number || github.run_id }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  # Recovery dispatches resolve the PR's current base ref at selector start.
  pull-requests: read
  # The Frontend build gate reads the run's job list to refuse carried-forward
  # upstream evidence (cave-38aud).
  actions: read

jobs:
  # This context is introduced alongside Frontend build during the protection
  # migration. It is deliberately non-path-aware: a required check must report
  # for every PR before branch protection can safely be switched to it.
  pr-checks:
    name: PR checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Refuse recovery SHA mismatch
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Recovery SHA mismatch: expected $EXPECTED_SHA but actual workflow SHA is $ACTUAL_SHA."
            exit 1
          fi

      - id: clock
        name: Start duration clock
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
          persist-credentials: false

      # This job IS the required check; a green from it that ran a stale tree
      # is the hazard this guard exists for (cave-d9xfq #4934).
      - name: Refuse a stale merge-tree checkout
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -f scripts/check-merge-tree-freshness.mjs || {
            echo "::error::Checked-out tree predates the merge-freshness guard (scripts/check-merge-tree-freshness.mjs is absent); refusing to run tests on a tree that cannot be the current merge (cave-d9xfq)."
            exit 1
          }
          node scripts/check-merge-tree-freshness.mjs --pr "$PR_NUMBER" --head "$HEAD_SHA"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:tests-wired
      # Each suite must report its own result even when an earlier step failed:
      # a test:app failure used to silently skip test:api and test:mobile, so a
      # skipped suite and a passed one looked identical (cave-t8p1a).
      # success() || failure() runs the suites unless the job was cancelled or
      # the environment never came up, and each failure still fails the job.
      - id: app-suite
        name: Frontend app tests
        if: success() || failure()
        run: pnpm test:app
      - id: api-suite
        name: Frontend API tests
        if: success() || failure()
        run: pnpm test:api
      - id: mobile-suite
        name: Mobile tests
        if: success() || failure()
        run: pnpm test:mobile

      - name: Summarize PR check duration
        if: always()
        env:
          START_EPOCH: ${{ steps.clock.outputs.epoch }}
          APP_OUTCOME: ${{ steps.app-suite.outcome }}
          API_OUTCOME: ${{ steps.api-suite.outcome }}
          MOBILE_OUTCOME: ${{ steps.mobile-suite.outcome }}
        run: |
          end_epoch=$(date +%s)
          duration=$((end_epoch - START_EPOCH))
          {
            echo "## PR checks"
            echo
            echo "- Duration: ${duration}s"
            echo "- Commit: $GITHUB_SHA"
            echo "- Suites: app=$APP_OUTCOME api=$API_OUTCOME mobile=$MOBILE_OUTCOME"
          } >> "$GITHUB_STEP_SUMMARY"

  paths:
    name: Select validation
    if: github.event_name != 'workflow_dispatch' || github.sha == inputs.expected_sha
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.paths.outputs.frontend }}
      rust: ${{ steps.paths.outputs.rust }}
      e2e: ${{ steps.paths.outputs.e2e }}
      ios: ${{ steps.paths.outputs.ios }}
      docs: ${{ steps.paths.outputs.docs }}
      run_base_ref: ${{ steps.base_snapshot.outputs.run_base_ref }}
      run_base_sha: ${{ steps.base_snapshot.outputs.run_base_sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: base_snapshot
        name: Capture run base snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.expected_sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.expected_pr_number }}
        run: node scripts/capture-ci-base-snapshot.mjs >> "$GITHUB_OUTPUT"

      # The path selector's verdict decides which jobs run at all; a stale
      # tree here could silently skip a lane the PR actually touches
      # (cave-d9xfq).
      - name: Refuse a stale merge-tree checkout
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -f scripts/check-merge-tree-freshness.mjs || {
            echo "::error::Checked-out tree predates the merge-freshness guard (scripts/check-merge-tree-freshness.mjs is absent); refusing to select paths from a tree that cannot be the current merge (cave-d9xfq)."
            exit 1
          }
          node scripts/check-merge-tree-freshness.mjs --pr "$PR_NUMBER" --head "$HEAD_SHA"

      - id: paths
        name: Select path-aware validation
        env:
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || steps.base_snapshot.outputs.run_base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.expected_sha || github.sha }}
        run: node scripts/ci-paths.mjs --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - run: node scripts/check-conflict-markers.mjs
      - run: node --test scripts/ci-paths.test.mjs

  ios:
    name: iOS build
    needs: paths
    if: needs.paths.outputs.ios == 'true' && (github.event_name != 'workflow_dispatch' || github.sha == inputs.expected_sha)
    runs-on: macos-15
    # Raised from 30 when the suite started actually executing (cave-ac372).
    # A booted simulator plus ~684 unit tests is the added cost; the ceiling is
    # deliberately well above the observed runtime so a slow runner does not
    # read as a test failure.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # Guards the checked-out tree against the stale-merge hazard
      # (cave-d9xfq): the checkout's CONTENT must match refs/pull/<n>/merge
      # fetched fresh at job time, or the run's verdict is about the wrong
      # tree. Two jobs in one run once took different trees (#4922), so every
      # job that checks out the PR tree runs this.
      - name: Refuse a stale merge-tree checkout
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -f scripts/check-merge-tree-freshness.mjs || {
            echo "::error::Checked-out tree predates the merge-freshness guard (scripts/check-merge-tree-freshness.mjs is absent); refusing to run tests on a tree that cannot be the current merge (cave-d9xfq)."
            exit 1
          }
          node scripts/check-merge-tree-freshness.mjs --pr "$PR_NUMBER" --head "$HEAD_SHA"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: brew install xcodegen
      - run: bash scripts/ios-xcodegen.sh

      - name: Compile the iOS app
        working-directory: apps/ios/CovenCave
        run: xcodebuild -scheme CovenCave -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build

      # The device name and iOS version on a hosted image change without
      # notice, so the destination is resolved rather than spelled. A hardcoded
      # `name=iPhone 16 Pro` turns an image bump into a red iOS job that reads
      # like a code failure. Selection is a tested JS function rather than a jq
      # filter because runtime versions must be compared NUMERICALLY — any
      # lexicographic sort ranks iOS-9-0 above iOS-26-0 (see
      # scripts/ios-select-simulator.test.mjs).
      - name: Boot an iOS Simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          if ! udid="$(xcrun simctl list devices available -j | node scripts/ios-select-simulator.mjs)"; then
            echo "::error::No available iPhone simulator on this runner image; the XCTest suite cannot run."
            xcrun simctl list devices available
            exit 1
          fi
          # Named here rather than in a job-level `env:` because the `runner`
          # context is unavailable there (actionlint catches it). Sharing an
          # explicit derived-data path makes the compile and run steps
          # provably agree on which products they mean, instead of relying on
          # both landing in the same default DerivedData.
          {
            echo "IOS_SIMULATOR_UDID=$udid"
            echo "IOS_DERIVED_DATA=$RUNNER_TEMP/ios-derived-data"
            echo "IOS_RESULT_BUNDLE=$RUNNER_TEMP/CovenCaveTests.xcresult"
          } >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl list devices booted

      # `build-for-testing` compiles the unit and UI test bundles. It was added
      # on its own first (#4946) because it needs no booted simulator: before
      # it, a Swift file under CovenCaveTests/ could be syntactically broken, or
      # assert against a symbol that no longer exists, and every PR stayed green.
      #
      # But compiling is where the gate USED to stop, and a suite that compiles
      # and never runs is a check that certifies its tests parse rather than
      # pass (cave-ac372). Building for the concrete destination the test action
      # will use keeps the two steps in agreement about architecture and SDK.
      - name: Compile the iOS test bundles
        working-directory: apps/ios/CovenCave
        run: |
          set -euo pipefail
          xcodebuild -scheme CovenCave \
            -destination "id=$IOS_SIMULATOR_UDID" \
            -derivedDataPath "$IOS_DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing

      # Only the unit bundle runs here. CovenCaveUITests drives the app through
      # XCUIApplication — minutes per case and the flakiest thing this pipeline
      # could own — so it keeps the compile gate above and stays out of the
      # blocking path. See cave-ac372 for the placement argument.
      #
      # ⚠️ The execution-time allowances are load-bearing, not tuning. The very
      # first run of this suite (32666989516, the run that proved these tests
      # had never executed) hung inside
      # AppModelProjectContextTests.testNewerStandaloneTasksLoadWinsOverOlderSuccessfulTaskSnapshot (cave-dwy2a)
      # and sat there for THIRTY-SIX MINUTES until the job timeout killed it.
      # xcodebuild left the result bundle unfinalized, so the run produced no
      # counts, no failure names, and a `cancelled` step — a verdict indistinguishable
      # from an infrastructure blip.
      #
      # XCTest's per-test allowance is NOT enforced unless timeouts are enabled,
      # which is why a 600s default did not stop a 36-minute hang. With them on,
      # a wedged test is failed and named and the suite CONTINUES, so one bad
      # test costs 60 seconds and still yields a full report. The measured suite
      # is fast — 140 cases executed in about 3 seconds — so 60s per test is
      # orders of magnitude of headroom, not a tight budget.
      #
      # ⚠️ `continue-on-error` is deliberate and is NOT a way to go green over a
      # failing suite. xcodebuild's exit status cannot distinguish "a test this
      # repository has explicitly deferred by name failed" from "a new test
      # failed", and it never notices a suite that executed nothing. The verify
      # step below is therefore the sole verdict — it reads the result bundle,
      # applies the source-derived floor, refuses skips and expected failures,
      # and fails on any failure not enumerated in QUARANTINED_FAILURES. The
      # outcome recorded here is handed to it and cross-checked, so a step that
      # died without leaving a bad bundle (a build error, a lost simulator, a
      # cancelled step) still fails the job. All three couplings are pinned by
      # scripts/ios-build-ci.test.mjs.
      - name: Run the iOS XCTest suite
        id: xctest
        continue-on-error: true
        working-directory: apps/ios/CovenCave
        run: |
          set -euo pipefail
          xcodebuild -scheme CovenCave \
            -destination "id=$IOS_SIMULATOR_UDID" \
            -derivedDataPath "$IOS_DERIVED_DATA" \
            -resultBundlePath "$IOS_RESULT_BUNDLE" \
            -only-testing:CovenCaveTests \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 60 \
            -maximum-test-execution-time-allowance 180 \
            CODE_SIGNING_ALLOWED=NO \
            test-without-building

      # xcodebuild's exit status covers "did every executed test pass". It does
      # NOT cover "did anything execute": a selector that matches no target
      # exits 0, which is the same green this bead was filed over, moved one
      # layer up. So the result bundle is read and the executed count is
      # compared against the number of XCTest methods in the source tree.
      # `always()` so a failing run still prints its counts and failures.
      #
      # It is also the ONLY verdict this job has (see the note on the step
      # above), and it gates more than the executed count: a skipped case and an
      # XCTExpectFailure are both rejected outright, because either would keep
      # the executed count at the floor while asserting nothing — the cheapest
      # and most invisible way to switch this gate off. A known failure is
      # deferred only by name, through QUARANTINED_FAILURES, where it expires
      # and where a listed test that starts passing fails the job.
      - name: Verify the iOS XCTest suite executed
        if: always()
        run: |
          node scripts/ios-xctest-summary.mjs \
            --result-bundle "$IOS_RESULT_BUNDLE" \
            --tests-dir apps/ios/CovenCave/CovenCaveTests \
            --xcodebuild-outcome "${{ steps.xctest.outcome }}"

  frontend-validation:
    name: Frontend validation (${{ matrix.validation.name }})
    needs: paths
    if: needs.paths.outputs.frontend == 'true' && (github.event_name != 'workflow_dispatch' || github.sha == inputs.expected_sha)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        validation:
          - name: lint
            command: lint
          - name: typecheck
            command: typecheck
          - name: test wiring
            command: check:tests-wired
          - name: protocol conformance
            command: test:conformance
          - name: app tests
            command: test:app
          - name: API tests
            command: test:api
          - name: mobile tests
            command: test:mobile
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # Guards the checked-out tree against the stale-merge hazard
      # (cave-d9xfq): the checkout's CONTENT must match refs/pull/<n>/merge
      # fetched fresh at job time, or the run's verdict is about the wrong
      # tree. Two jobs in one run once took different trees (#4922), so every
      # job that checks out the PR tree runs this.
      - name: Refuse a stale merge-tree checkout
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -f scripts/check-merge-tree-freshness.mjs || {
            echo "::error::Checked-out tree predates the merge-freshness guard (scripts/check-merge-tree-freshness.mjs is absent); refusing to run tests on a tree that cannot be the current merge (cave-d9xfq)."
            exit 1
          }
          node scripts/check-merge-tree-freshness.mjs --pr "$PR_NUMBER" --head "$HEAD_SHA"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ matrix.validation.command }}

  frontend-bundle:
    name: Frontend bundle
    needs: paths
    if: needs.paths.outputs.frontend == 'true' && (github.event_name != 'workflow_dispatch' || github.sha == inputs.expected_sha)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_CAVE_CRAFTS: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # Guards the checked-out tree against the stale-merge hazard
      # (cave-d9xfq): the checkout's CONTENT must match refs/pull/<n>/merge
      # fetched fresh at job time, or the run's verdict is about the wrong
      # tree. Two jobs in one run once took different trees (#4922), so every
      # job that checks out the PR tree runs this.
      - name: Refuse a stale merge-tree checkout
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -f scripts/check-merge-tree-freshness.mjs || {
            echo "::error::Checked-out tree predates the merge-freshness guard (scripts/check-merge-tree-freshness.mjs is absent); refusing to run tests on a tree that cannot be the current merge (cave-d9xfq)."
            exit 1
          }
          node scripts/check-merge-tree-freshness.mjs --pr "$PR_NUMBER" --head "$HEAD_SHA"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build with Turbopack flake retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if pnpm build; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::pnpm build attempt $attempt failed; retrying with clean .next"
              rm -rf .next
            fi
          done
          echo "::error::pnpm build failed after 3 attempts"
          exit 1

  frontend-e2e:
    name: Frontend E2E (${{ matrix.shard }}/8)
    needs: paths
    if: needs.paths.outputs.e2e == 'true' && (github.event_name != 'workflow_dispatch' || github.sha == inputs.expected_sha)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      NEXT_PUBLIC_CAVE_CRAFTS: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # Guards the checked-out tree against the stale-merge hazard
      # (cave-d9xfq): the checkout's CONTENT must match refs/pull/<n>/merge
      # fetched fresh at job time, or the run's verdict is about the wrong
      # tree. Two jobs in one run once took different trees (#4922), so every
      # job that checks out the PR tree runs this.
      - name: Refuse a stale merge-tree checkout
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -f scripts/check-merge-tree-freshness.mjs || {
            echo "::error::Checked-out tree predates the merge-freshness guard (scripts/check-merge-tree-freshness.mjs is absent); refusing to run tests on a tree that cannot be the current merge (cave-d9xfq)."
            exit 1
          }
          node scripts/check-merge-tree-freshness.mjs --pr "$PR_NUMBER" --head "$HEAD_SHA"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit

      - name: Validate end-to-end behavior
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/8 --workers=1

  frontend-e2e-agentic:
    name: Frontend E2E (agentic)
    needs: paths
    if: needs.paths.outputs.e2e == 'true' && (github.event_name != 'workflow_dispatch' || github.sha == inputs.expected_sha)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_CAVE_CRAFTS: "1"
      NEXT_PUBLIC_CAVE_AGENTIC_RECOMMENDATIONS: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # Guards the checked-out tree against the stale-merge hazard
      # (cave-d9xfq): the checkout's CONTENT must match refs/pull/<n>/merge
      # fetched fresh at job time, or the run's verdict is about the wrong
      # tree. Two jobs in one run once took different trees (#4922), so every
      # job that checks out the PR tree runs this.
      - name: Refuse a stale merge-tree checkout
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -f scripts/check-merge-tree-freshness.mjs || {
            echo "::error::Checked-out tree predates the merge-freshness guard (scripts/check-merge-tree-freshness.mjs is absent); refusing to run tests on a tree that cannot be the current merge (cave-d9xfq)."
            exit 1
          }
          node scripts/check-merge-tree-freshness.mjs --pr "$PR_NUMBER" --head "$HEAD_SHA"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit

      # This is a separate Playwright invocation, so its webServer starts with
      # the explicit public capability instead of sharing a default-off server.
      - name: Validate flag-enabled agentic journeys
        run: pnpm exec playwright test tests/agentic-enhance.spec.ts tests/research-desk-tabs.spec.ts --project=desktop --workers=1 --no-deps

  build:
    name: Frontend build
    needs: [paths, ios, frontend-validation, frontend-bundle, frontend-e2e, frontend-e2e-agentic]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_CAVE_CRAFTS: "1"
    steps:
      - name: Refuse recovery SHA mismatch
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Recovery SHA mismatch: expected $EXPECTED_SHA but actual workflow SHA is $ACTUAL_SHA."
            exit 1
          fi

      - name: Require selected validation
        env:
          PATHS_RESULT: ${{ needs.paths.result }}
          FRONTEND_ENABLED: ${{ needs.paths.outputs.frontend }}
          FRONTEND_VALIDATION_RESULT: ${{ needs.frontend-validation.result }}
          FRONTEND_BUNDLE_RESULT: ${{ needs.frontend-bundle.result }}
          E2E_ENABLED: ${{ needs.paths.outputs.e2e }}
          FRONTEND_E2E_RESULT: ${{ needs.frontend-e2e.result }}
          FRONTEND_E2E_AGENTIC_RESULT: ${{ needs.frontend-e2e-agentic.result }}
          IOS_ENABLED: ${{ needs.paths.outputs.ios }}
          IOS_RESULT: ${{ needs.ios.result }}
        run: |
          set -euo pipefail
          test "$PATHS_RESULT" = "success"
          if [ "$FRONTEND_ENABLED" = "true" ]; then
            test "$FRONTEND_VALIDATION_RESULT" = "success"
            test "$FRONTEND_BUNDLE_RESULT" = "success"
          fi
          if [ "$E2E_ENABLED" = "true" ]; then
            test "$FRONTEND_E2E_RESULT" = "success"
            test "$FRONTEND_E2E_AGENTIC_RESULT" = "success"
          fi
          if [ "$IOS_ENABLED" = "true" ]; then
            test "$IOS_RESULT" = "success"
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # Guards the checked-out tree against the stale-merge hazard
      # (cave-d9xfq): the checkout's CONTENT must match refs/pull/<n>/merge
      # fetched fresh at job time, or the run's verdict is about the wrong
      # tree. Two jobs in one run once took different trees (#4922), so every
      # job that checks out the PR tree runs this.
      - name: Refuse a stale merge-tree checkout
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -f scripts/check-merge-tree-freshness.mjs || {
            echo "::error::Checked-out tree predates the merge-freshness guard (scripts/check-merge-tree-freshness.mjs is absent); refusing to run tests on a tree that cannot be the current merge (cave-d9xfq)."
            exit 1
          }
          node scripts/check-merge-tree-freshness.mjs --pr "$PR_NUMBER" --head "$HEAD_SHA"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Refuse carried-forward upstream evidence
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.expected_sha || github.sha }}
          RUN_BASE_REF: ${{ needs.paths.outputs.run_base_ref }}
          RUN_BASE_SHA: ${{ needs.paths.outputs.run_base_sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # The jobs API reports the PR head SHA, not github.sha's synthetic
          # merge SHA. A carried-forward job is also relabelled with the new
          # run_attempt but retains its old started_at, so both domains matter.
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > /tmp/cave-build-evidence-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?filter=latest&per_page=100" > /tmp/cave-build-evidence-jobs.json
          ATTEMPT_STARTED_AT="$(jq -er '.run_started_at | select(type == "string" and length > 0)' /tmp/cave-build-evidence-run.json)"

          # Select validation froze this pair before any validation lane ran.
          # Resolve the branch tip again now; missing selector outputs fail
          # closed in check-build-evidence's argument validation.
          LIVE_BASE_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$RUN_BASE_REF" --jq .object.sha)"

          node scripts/check-build-evidence.mjs \
            --expected-head-sha "$EXPECTED_HEAD_SHA" \
            --attempt-started-at "$ATTEMPT_STARTED_AT" \
            --run-base-ref "$RUN_BASE_REF" \
            --run-base-sha "$RUN_BASE_SHA" \
            --live-base-sha "$LIVE_BASE_SHA" \
            < /tmp/cave-build-evidence-jobs.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      # Runs without pnpm install: the test imports only node builtins, so a
      # documentation-only PR — which skips the frontend step entirely — still
      # gets the docs index checked. That is the case the ratchet exists for.
      - name: Validate docs
        if: needs.paths.outputs.docs == 'true'
        run: node scripts/docs-index.test.mjs

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-03-27
        if: needs.paths.outputs.rust == 'true'

      - name: Install Tauri system dependencies
        if: needs.paths.outputs.rust == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        if: needs.paths.outputs.rust == 'true'
        with:
          workspaces: src-tauri -> target

      - name: Validate Rust
        if: needs.paths.outputs.rust == 'true'
        working-directory: src-tauri
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p resources/server resources/node
          touch resources/server/.cargo-check-placeholder
          touch resources/node/.cargo-check-placeholder
          cargo check --locked
          cargo test --locked --lib

      - name: Report skipped suites
        if: needs.paths.outputs.frontend != 'true' || needs.paths.outputs.rust != 'true' || needs.paths.outputs.e2e != 'true' || needs.paths.outputs.ios != 'true' || needs.paths.outputs.docs != 'true'
        run: |
          echo "frontend=${{ needs.paths.outputs.frontend }}"
          echo "rust=${{ needs.paths.outputs.rust }}"
          echo "e2e=${{ needs.paths.outputs.e2e }}"
          echo "ios=${{ needs.paths.outputs.ios }} (${{ needs.ios.result }})"
          echo "docs=${{ needs.paths.outputs.docs }}"
