name: Recover missing PR CI

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: ci-recovery
  cancel-in-progress: false

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      # Recovery reads each candidate's workflow guards with the YAML parser.
      - run: pnpm install --frozen-lockfile

      - name: Detect and recover missing CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        # Only full retries of eligible cancelled pull_request runs are automatic.
        # Missing PR events, approval gates, stale snapshots and partial guards
        # report the exact maintainer action. API/evidence faults fail this job.
        # A rerun request is not a passing required check or merge permission.
        run: node scripts/ci-recovery.mjs --apply
