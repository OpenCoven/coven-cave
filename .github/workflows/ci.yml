name: CI
run-name: CI ${{ github.event_name }} ${{ inputs.expected_sha || github.sha }}

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Expected pull request head SHA
        required: true
        type: string
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.head.sha || inputs.expected_sha || github.sha }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  paths:
    name: Select validation
    if: github.event_name != 'workflow_dispatch' || github.sha == inputs.expected_sha
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.paths.outputs.frontend }}
      rust: ${{ steps.paths.outputs.rust }}
      e2e: ${{ steps.paths.outputs.e2e }}
      ios: ${{ steps.paths.outputs.ios }}
      docs: ${{ steps.paths.outputs.docs }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: paths
        name: Select path-aware validation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.expected_sha || github.sha }}
        run: node scripts/ci-paths.mjs --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - run: node scripts/check-conflict-markers.mjs
      - run: node --test scripts/ci-paths.test.mjs

  ios:
    name: iOS build
    needs: paths
    if: needs.paths.outputs.ios == 'true' && (github.event_name != 'workflow_dispatch' || github.sha == inputs.expected_sha)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: brew install xcodegen
      - run: bash scripts/ios-xcodegen.sh

      - name: Compile the iOS app
        working-directory: apps/ios/CovenCave
        run: xcodebuild -scheme CovenCave -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build

  build:
    name: Frontend build
    needs: [paths, ios]
    if: always() && (github.event_name != 'workflow_dispatch' || github.sha == inputs.expected_sha)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_CAVE_CRAFTS: "1"
    steps:
      - name: Require selected validation
        env:
          PATHS_RESULT: ${{ needs.paths.result }}
          IOS_ENABLED: ${{ needs.paths.outputs.ios }}
          IOS_RESULT: ${{ needs.ios.result }}
        run: |
          set -euo pipefail
          test "$PATHS_RESULT" = "success"
          if [ "$IOS_ENABLED" = "true" ]; then
            test "$IOS_RESULT" = "success"
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      # Runs without pnpm install: the test imports only node builtins, so a
      # documentation-only PR — which skips the frontend step entirely — still
      # gets the docs index checked. That is the case the ratchet exists for.
      - name: Validate docs
        if: needs.paths.outputs.docs == 'true'
        run: node scripts/docs-index.test.mjs

      - name: Install JavaScript dependencies
        if: needs.paths.outputs.frontend == 'true' || needs.paths.outputs.e2e == 'true'
        run: pnpm install --frozen-lockfile

      - name: Validate frontend
        if: needs.paths.outputs.frontend == 'true'
        shell: bash
        run: |
          set -euo pipefail
          pnpm lint
          pnpm typecheck
          pnpm check:tests-wired
          pnpm test:app
          pnpm test:api
          pnpm test:mobile
          for attempt in 1 2 3; do
            if pnpm build; then
              exit 0
            fi
            echo "::warning::pnpm build attempt $attempt failed; retrying with clean .next"
            rm -rf .next
          done
          exit 1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-03-27
        if: needs.paths.outputs.rust == 'true'

      - name: Install Tauri system dependencies
        if: needs.paths.outputs.rust == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        if: needs.paths.outputs.rust == 'true'
        with:
          workspaces: src-tauri -> target

      - name: Validate Rust
        if: needs.paths.outputs.rust == 'true'
        working-directory: src-tauri
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p resources/server resources/node
          touch resources/server/.cargo-check-placeholder
          touch resources/node/.cargo-check-placeholder
          cargo check --locked
          cargo test --locked --lib

      - name: Install Playwright browsers
        if: needs.paths.outputs.e2e == 'true'
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Validate end-to-end behavior
        if: needs.paths.outputs.e2e == 'true'
        run: pnpm exec playwright test

      - name: Report skipped suites
        if: needs.paths.outputs.frontend != 'true' || needs.paths.outputs.rust != 'true' || needs.paths.outputs.e2e != 'true' || needs.paths.outputs.ios != 'true' || needs.paths.outputs.docs != 'true'
        run: |
          echo "frontend=${{ needs.paths.outputs.frontend }}"
          echo "rust=${{ needs.paths.outputs.rust }}"
          echo "e2e=${{ needs.paths.outputs.e2e }}"
          echo "ios=${{ needs.paths.outputs.ios }} (${{ needs.ios.result }})"
          echo "docs=${{ needs.paths.outputs.docs }}"
