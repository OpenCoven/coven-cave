name: iOS release toolchain

on:
  pull_request:
    paths:
      - 'apps/ios/**'
      - 'scripts/ios-xcodegen.sh'
      - 'scripts/build-ios-markdown.mjs'
      - 'scripts/ios-build-ci.test.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ios-release-toolchain.yml'
      - '.github/workflows/release.yml'

permissions:
  contents: read

jobs:
  compile:
    name: Unsigned iOS compile (Xcode ${{ matrix.version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: xcode-27
            version: '27.1'
            sdk: '27.1'
          - runner: macos-15
            version: '26.3'
            sdk: '26.2'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.version }}.app/Contents/Developer
      EXPECTED_XCODE: ${{ matrix.version }}
      EXPECTED_SDK: ${{ matrix.sdk }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify selected compiler and device SDK
        run: |
          set -euo pipefail
          git rev-parse HEAD
          xcodebuild -version
          xcodebuild -version | grep -Fx "Xcode $EXPECTED_XCODE"
          sdk_version=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "Selected iPhoneOS SDK: $sdk_version"
          test "$sdk_version" = "$EXPECTED_SDK"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: brew install xcodegen
      - run: bash scripts/ios-xcodegen.sh
      - name: Compile the app and embedded widget without signing
        working-directory: apps/ios/CovenCave
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/ios-toolchain-build"
          xcodebuild -scheme CovenCave -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$output" CODE_SIGNING_ALLOWED=NO build
          test -x "$output/Build/Products/Release-iphoneos/CovenCave.app/PlugIns/CovenCaveWidgets.appex/CovenCaveWidgets"
